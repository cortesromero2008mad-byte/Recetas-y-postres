<!DOCTYPE html>
<html lang="es">
<head>
    <title>Recetas de Postres</title>
    <style>
        /*---Profe en los enlaces de pinterest estos ya traen por defecto sus detalles osea los width y asi, tambien no solo puede mover las tapas puede apretar las imagenes de los postres y estas lo envian a la pagina de donde viene el enlace---*/
        /*---tambien utilize un poco la ia para poder sabes como colocar los enlaces de pinterest por que estos utilizan iframes y no sabia como agregarlos---*/ 
        body {
            background-color: #fff9c4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1 { color: #d81b60; }

        .contenedor-recetas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1000px;
            margin: 40px auto;
        }

        .recetarios {
            position: relative;
            width: 300px;
            height: 400px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 5px solid #f06292;
        }

        .contenido {
            width: 100%;
            height: 100%;
            transition: transform 0.5s, filter 0.5s;
            filter: brightness(0.6);
        }

        .tapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fce4ec;
            background-image: url(https://coin-images.coingecko.com/coins/images/53148/large/IMG_8373.JPG?1735662644); 
            background-size: cover;
            background-position: center;
            z-index: 5;
            transition: transform 0.6s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #880e4f;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .recetarios:hover .tapa {
            transform: translateY(-100%);
        }

        .recetarios:hover .contenido {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>Menú de Repostería</h1>
    <p>Pasa el mouse sobre las bandejas para descubrir las recetas</p>

    <div class="contenedor-recetas">
        
        <div class="recetarios">
